name: Bug report
description: Something does not work as described in the documentation
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Privacy:** do not paste medication names, profile names or screenshots with real data. The app log at `info`
        level contains no names and is safe to paste.
  - type: input
    id: version
    attributes:
      label: MedStock version
      placeholder: "1.2.3"
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version and installation type
      placeholder: "2026.11.0, Home Assistant OS on amd64"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Steps to reproduce, with made-up names (e.g. "Medicine A, 8 per day").
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: App log
      description: Settings › Apps › MedStock › Log (info level).
      render: text
