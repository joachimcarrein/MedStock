# Builds the app image for amd64 and aarch64 on native runners, signs it and publishes a multi-arch manifest:
#   ghcr.io/joachimcarrein/amd64-medstock:<version>, ghcr.io/joachimcarrein/aarch64-medstock:<version>
#   ghcr.io/joachimcarrein/medstock:<version>   (the name used by `image:` in medstock/config.yaml)
# Called by the Release workflow (release.yaml). Can also be started by hand to rebuild an existing version.
name: Build

on:
  workflow_call:
    inputs:
      version:
        description: Version to build (must equal `version` in medstock/config.yaml at `ref`)
        required: true
        type: string
      ref:
        description: Git ref (branch, tag or SHA) to build
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (must equal `version` in medstock/config.yaml at `ref`)
        required: true
        type: string
      ref:
        description: Git ref (branch, tag or SHA) to build
        required: true
        type: string

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: medstock

permissions:
  contents: read

jobs:
  init:
    name: Initialize build
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Version must match config.yaml
        env:
          VERSION: ${{ inputs.version }}
        run: |
          configured=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' medstock/config.yaml)
          echo "requested $VERSION, config.yaml $configured"
          if [ "$VERSION" != "$configured" ]; then
            echo "::error::Version $VERSION does not match $configured in medstock/config.yaml"
            exit 1
          fi

      - name: Get build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: init
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # check out the code
      id-token: write # Cosign signing
      packages: write # push to GitHub Container Registry
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Build image
        uses: home-assistant/builder/actions/build-image@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          arch: ${{ matrix.arch }}
          context: medstock
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ inputs.version }}
            latest
          labels: |
            io.hass.type=addon
            io.hass.name=MedStock
            io.hass.description=Household medication stock tracker
            io.hass.url=https://github.com/joachimcarrein/MedStock
          push: "true"
          skip-existing: ${{ inputs.version }}
          version: ${{ inputs.version }}

  manifest:
    name: Publish multi-arch manifest
    needs: [init, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Cosign signing
      packages: write # push the manifest
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            ${{ inputs.version }}
            latest
          skip-existing: ${{ inputs.version }}
