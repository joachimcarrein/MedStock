# Weekly update pull requests for NuGet packages, GitHub Actions (pinned by SHA) and the Docker base images.
# One PR per ecosystem (groups). .NET 11 (STS) is skipped for the Docker images and Microsoft.* packages:
# the app stays on .NET 10 LTS until .NET 12 LTS, which Dependabot will propose again. Merge that together
# with a TargetFramework change to net12.0 (an aspnet 12 image cannot run a net10.0 app).
version: 2
updates:
  - package-ecosystem: nuget
    directory: /medstock/src
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]
    ignore:
      - dependency-name: "Microsoft.*"
        versions: [">= 11.0, < 12.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /medstock
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        versions: [">= 11.0, < 12.0"]
