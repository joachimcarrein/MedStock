name: MedStock
version: "1.3.0"
slug: medstock
description: Household medication stock tracker – know how many days you have left
url: https://github.com/joachimcarrein/MedStock
image: ghcr.io/joachimcarrein/medstock
arch:
  - aarch64
  - amd64
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:pill
panel_title: MedStock
panel_admin: false
homeassistant_api: true
services:
  - mqtt:want                 # broker credentials for the optional sensors (MQTT discovery)
backup: cold
options:
  log_level: info
schema:
  log_level: list(trace|debug|info|warning|error)?
