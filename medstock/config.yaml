name: MedStock
version: "0.1.0"
slug: medstock
description: Household medication stock tracker – know how many days you have left
url: https://github.com/joachimcarrein/MedStock
arch:
  - aarch64
  - amd64
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:pill
panel_title: MedStock
panel_admin: false
homeassistant_api: true
backup: cold
options:
  log_level: info
schema:
  log_level: list(trace|debug|info|warning|error)?
